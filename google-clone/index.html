<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div class="header-left-side">
                <p><a href="#">About</a></p>
                <p><a href="#">Store</a></p>
            </div>
            <div class="header-right-side">
                <p><a href="#">Gmail</a></p>
                <p><a href="#">Images</a></p>
                <p><img src="./menuIcon.png" alt=""></p>
                <p><img id="account" src="./account_circle_32dp_1F1F1F_FILL0_wght400_GRAD0_opsz40.svg" alt=""></p>
            </div>
        </div>
        <div class="middle-section">
            <div class="google-img">
                <h1><img src="./google.png" alt=""></h1>
               
                <div class="search-box">
                    <span class="search-icon"><img src="./search.png" alt=""></span>
                    <input type="text" placeholder="Search Google or type a URL">
            
                    <span class="mic"><img src="./mic.png" alt=""></span>
                    <span class="mic-lens"><img src="./googlelens.png" alt=""></span>
                </div>

                <div class="buttons">
                    <button>Google Search</button>
                    <button>I'm Feeling Lucky</button>
                </div>
            </div> 
        </div>
    </div>
</body>
</html>
